[project]
name = "uae-cards"
version = "0.1.0"
description = "Polite scraper + Pydantic normalizer for UAE credit card data (kredit.ae primary, finafy.ae / creditcardfinder.ae / yallacompare.com cross-reference)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.6",
  "protego>=0.3",
  "rapidfuzz>=3.0",
  "python-slugify>=8.0",
  "truststore>=0.9",
]

[project.optional-dependencies]
render = ["playwright>=1.45"]
llm = ["anthropic>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
uae-cards = "uae_cards.__main__:main"

[tool.setuptools.packages.find]
include = ["uae_cards*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
